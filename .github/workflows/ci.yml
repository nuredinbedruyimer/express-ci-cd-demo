name: CI

on:
  pull_request:
    branches:
      - develop
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: github-ci-cd-action
    

jobs:
  build:
    runs-on: ubuntu-latest
    

    steps:
        #  this one is the step on which we gonna copy the code of our repo
        #  it gonna use prebuild way to copy the repo code from the branch which trigger this event / develop
      - name: Checkout source
        uses: actions/checkout@v5
        #  install nodejs with the version 22 

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
        #  install dependencies of the project untill now we have 1. nodejs 2. the code 3. the package for the project and the command to buld it
      - name: Install dependencies
        run: npm install
      - name: Run ESLint
        run: npm run lint
      - name: Build application
        run: npm run build
        #  this one is building docker imaga phase to check docker helath check
      - name: Log in Github Container Registry
        uses: docker/login-action@v3
        with:
            registry: ${{ env.REGISTRY}}
            username: ${{ github.actor}}
            password: ${{ secrets.GITHUB_TOKEN}}
      - name: Build Docker image
        run: |
          docker build \
            -t $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:latest .
      - name: Push Docker Image
        run: |
          docker push $REGISTRY/${{github.repository_owner}}/$IMAGE_NAME:latest
