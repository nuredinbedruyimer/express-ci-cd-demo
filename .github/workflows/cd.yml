name: CD Staging

on:
  push:
    branches:
      - develop


permissions:
  contents: read
  packages: write


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: github-ci-cd-action


jobs:
  docker:
    runs-on: ubuntu-latest


    steps:

      - name: Checkout source
        uses: actions/checkout@v5


      - name: Login Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Docker image
        run: |
          docker build \
          -t $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:${{github.sha}} .


      - name: Push Docker Image
        run: |
          docker push \
          $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:${{github.sha}}